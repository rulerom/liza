site_name: Liza
site_description: 'Liza — системный язык для производительных сетевых сервисов с определённым поведением, контролируемыми ресурсами и математически проверяемыми свойствами.'
site_url: https://liza.rulerom.com/
repo_url: https://github.com/rulerom/liza
repo_name: rulerom/liza
strict: true
# Direct object URLs also work without directory-index rewrites in S3.
use_directory_urls: false

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/liza-logo.png
  favicon: assets/images/liza-logo.png
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
  font: false

extra:
  social_image: assets/images/liza-logo.png
  social_image_alt: 'Логотип Liza — девушка с лисьими ушами и надпись Liza.'
  social_image_width: 640
  social_image_height: 640

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight:
      pygments_lang_class: true
      anchor_linenums: true
      line_spans: __span
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_css:
  - assets/stylesheets/site.css

nav:
  - Liza: index.md
  - Verified Network Gateway: network-gateway.md
  - Gateway R0 reproduction: gateway-reproduction.md
  - Быстрый старт: getting-started.md
  - Основы языка: basics.md
  - CLI-приложение liza-text: cli.md
  - Потоковый JSON: json.md
  - "T3: bounded StringBuilder": string-builder.md
  - Ресурсные структуры: resource-structures.md
  - Владеющий UTF-8 (T1): owned-string.md
  - Readonly-доступ (T2-A): readonly-access.md
  - "M0: mutable-доступ": mutable-access.md
  - "M0: аудит доступа": mutable-audit.md
  - "M0: JSON performance": mutable-performance.md
  - Performance Parity — JSON ARM64: performance-parity.md
  - Performance Parity — bounded inlining: inlining-policy.md
  - Performance Parity — state and aliasing: state-alias-analysis.md
  - Performance Parity — guard and CFG: guard-cfg-investigation.md
  - Production field forwarding: field-forwarding.md
  - "T2-B: local subviews (plan)": local-subviews.md
  - "JSON performance (plan)": json-performance.md
  - Lowering составных значений: aggregate-lowering.md
  - Запись файлов и liza-copy: file-output.md
  - TCP echo server: tcp.md
  - TCP message server: message-server.md
  - TCP reactor: reactor.md
  - Message Router: message-router.md
  - L4 TCP Proxy: tcp-proxy.md
  - TCP Proxy Operations: tcp-proxy-operations.md
  - Редактор Zed: editor.md
  - Milestones: milestones.md
  - Verification pipeline: verification-pipeline.md
  - Liza Verified V0: verified.md
  - Liza Verified V1: verified-v1.md
  - Liza Verified V2: verified-v2.md
  - Liza Verified V3: verified-v3.md
  - Liza Verified V4: verified-v4.md
  - Verified Relay R1: verified-relay-r1.md
  - Verified Relay R2: verified-relay-r2.md
  - Verified Relay R2-B: verified-relay-r2b.md
  - Verified Relay R2-C: verified-relay-r2c.md
  - Язык:
      - Модель вычислений и памяти: design.md
      - Исполняемое ядро: core.md
      - Числовая модель: numeric-model.md
      - Минимальный I/O: io-model.md
      - UTF-8 текст: utf8.md
      - Потоковый UTF-8: utf8-stream.md
      - Пользовательские модули: modules.md
      - Generics: generics.md
      - Регионы и память: regions.md
  - Эталонные программы: reference-programs.md
  - Таблица соединений: connection-table.md
  - План разработки: roadmap.md
  - Линейные результаты и Vec: bounded-vec.md
  - Явный рост Vec: vec-reserve.md
  - Разбор программы Vec: bounded-vec-walkthrough.md
