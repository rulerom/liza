site_name: Liza
site_description: 'Liza — экспериментальный системный язык для сетевой инфраструктуры с определённой семантикой и явным управлением ресурсами.'
site_url: https://liza.rulerom.com/
repo_url: https://github.com/rulerom/liza
repo_name: rulerom/liza
strict: true
# Keep existing .html URLs stable across hosting providers.
use_directory_urls: false

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/liza-logo.png
  favicon: assets/images/liza-logo.png
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.copy
  font: false

extra:
  social_image: assets/images/liza-logo.png
  social_image_alt: 'Логотип Liza — девушка с лисьими ушами и надпись Liza.'
  social_image_width: 640
  social_image_height: 640

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight:
      pygments_lang_class: true
      anchor_linenums: true
      line_spans: __span
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_css:
  - assets/stylesheets/site.css

