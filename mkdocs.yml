site_name: Liza
site_description: 'Liza — экспериментальный системный язык для сетевой инфраструктуры с определённой семантикой и явным управлением ресурсами.'
site_url: https://liza.rulerom.com/
repo_url: https://github.com/rulerom/liza
repo_name: rulerom/liza
strict: true
# Direct object URLs also work without directory-index rewrites in S3.
use_directory_urls: false

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/liza-logo.png
  favicon: assets/images/liza-logo.png
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.copy
  font: false

extra:
  social_image: assets/images/liza-logo.png
  social_image_alt: 'Логотип Liza — девушка с лисьими ушами и надпись Liza.'
  social_image_width: 640
  social_image_height: 640

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight:
      pygments_lang_class: true
      anchor_linenums: true
      line_spans: __span
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_css:
  - assets/stylesheets/site.css

# Published and searchable, but reached through the research index rather than
# filling the primary navigation with individual experiment reports.
not_in_nav: |
  research.md
  scoped-channel-model.md
  json-performance.md
  mutable-audit.md
  mutable-performance.md
  performance-parity.md
  inlining-policy.md
  state-alias-analysis.md
  guard-cfg-investigation.md
  field-forwarding.md
  aggregate-lowering.md
  verification-pipeline.md
  verified.md
  verified-v1.md
  verified-v2.md
  verified-v3.md
  verified-v4.md
  verified-relay-r1.md
  verified-relay-r2.md
  verified-relay-r2b.md
  verified-relay-r2c.md

nav:
  - Главная: index.md
  - Начало работы:
      - Быстрый старт: getting-started.md
      - Редактор Zed: editor.md
  - Язык:
      - Основы: basics.md
      - Модель вычислений и памяти: design.md
      - Исполняемое ядро: core.md
      - Числовая модель: numeric-model.md
      - Модули: modules.md
      - Generics: generics.md
      - Регионы и память: regions.md
      - Ресурсные структуры: resource-structures.md
      - Readonly-заимствование: readonly-access.md
      - Mutable-заимствование: mutable-access.md
      - Локальные subviews: local-subviews.md
      - Экспериментальные workers: scoped-workers.md
      - Экспериментальный scoped-канал: scoped-channels.md
      - Эффекты и I/O: io-model.md
  - Библиотеки:
      - UTF-8: utf8.md
      - Потоковый UTF-8: utf8-stream.md
      - Владеющий String: owned-string.md
      - StringBuilder: string-builder.md
      - Потоковый JSON: json.md
      - JSON tokenizer (контракт): json-tokenizer.md
      - Линейные результаты и Vec: bounded-vec.md
      - Явный рост Vec: vec-reserve.md
      - Таблица соединений: connection-table.md
  - Приложения и примеры:
      - Эталонные программы: reference-programs.md
      - Управление reactor через канал: channel-reactor-example.md
      - Разбор программы Vec: bounded-vec-walkthrough.md
      - CLI-приложение liza-text: cli.md
      - Запись файлов и liza-copy: file-output.md
      - UDP: udp.md
      - TCP echo server: tcp.md
      - TCP message server: message-server.md
      - TCP reactor: reactor.md
      - Message Router: message-router.md
      - L4 TCP Proxy: tcp-proxy.md
      - TCP Proxy Operations: tcp-proxy-operations.md
  - Бенчмарки: network-performance.md
  - Проект:
      - Verified Network Gateway: network-gateway.md
      - "MT0-A: изолированные workers": mt0a-workers.md
      - "Scoped channels: контракт": scoped-channels-contract.md
      - Gateway R0 reproduction: gateway-reproduction.md
      - План разработки: roadmap.md
      - Milestones: milestones.md
