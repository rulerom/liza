site_name: Liza
site_description: 'Liza — системный язык программирования для переносимых вычислений с определённой семантикой и контролируемой стоимостью операций.'
site_url: https://liza.rulerom.com/
repo_url: https://github.com/rulerom/liza
repo_name: rulerom/liza
strict: true
# Direct object URLs also work without directory-index rewrites in S3.
use_directory_urls: false

theme:
  name: material
  custom_dir: overrides
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
  font: false

extra:
  social_image: assets/images/liza-social-v2.png
  social_image_alt: 'Liza — системный язык программирования для переносимых вычислений с определённой семантикой и контролируемой стоимостью операций. Контролируемая стоимость — проектная цель.'

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight:
      pygments_lang_class: true
      anchor_linenums: true
      line_spans: __span
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_css:
  - assets/stylesheets/site.css

nav:
  - Liza: index.md
  - Быстрый старт: getting-started.md
  - Основы языка: basics.md
  - Редактор Zed: editor.md
  - Milestones: milestones.md
  - Язык:
      - Модель и открытые решения: design.md
      - Исполняемое ядро: core.md
      - Числовая модель: numeric-model.md
      - Минимальный I/O: io-model.md
      - Пользовательские модули: modules.md
      - Generics: generics.md
      - Регионы и память: regions.md
  - Эталонные программы: reference-programs.md
  - Таблица соединений: connection-table.md
  - План разработки: roadmap.md
  - Линейные результаты и Vec: bounded-vec.md
  - Явный рост Vec: vec-reserve.md
  - Разбор программы Vec: bounded-vec-walkthrough.md
