name: Editor support
on:
  pull_request:
    paths:
      - 'editors/**'
      - 'examples/**'
      - 'tests/fixtures/**'
      - 'tools/check_editor.py'
      - '.github/workflows/editor.yml'
  push:
    branches: [main]
    paths:
      - 'editors/**'
      - 'examples/**'
      - 'tests/fixtures/**'
      - 'tools/check_editor.py'
      - '.github/workflows/editor.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tree-sitter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: npm ci --prefix editors/tree-sitter-liza
      - run: npm run generate --prefix editors/tree-sitter-liza
      - run: git diff --exit-code -- editors/tree-sitter-liza/src
      - run: python tools/check_editor.py
