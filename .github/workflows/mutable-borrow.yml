name: Mutable borrow and JSON agreement
on:
  pull_request:
    paths:
      - 'liza/**'
      - 'tests/test_mutable*.py'
      - 'benchmarks/mutable/**'
      - 'benchmarks/aggregate/**'
      - 'benchmarks/json/**'
      - 'examples/text/**'
      - '.github/workflows/mutable-borrow.yml'
  push:
    branches: [main]
    paths:
      - 'liza/**'
      - 'tests/test_mutable*.py'
      - 'benchmarks/mutable/**'
      - 'benchmarks/aggregate/**'
      - 'benchmarks/json/**'
      - 'examples/text/**'
      - '.github/workflows/mutable-borrow.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  field-borrow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: clang --version
      - name: Nested field exclusivity, snapshots and mutation replay
        run: >-
          python -m unittest
          tests.test_mutable_borrow.MutableBorrowChecking
          tests.test_mutable_borrow.MutableBorrowNative.test_nested_field_reborrow_snapshots_and_distinct_roots
          tests.test_mutable_borrow.MutableBorrowNative.test_parent_argument_snapshot_precedes_field_mutation
          tests.test_mutable_borrow.MutableBorrowNative.test_mutant_field_reborrow_cannot_alias_parent_reader
          -v
  agreement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: M0 native semantics and mutation replay
        run: python -m unittest discover -s tests -p 'test_mutable*.py' -v
      - name: Frozen A0/A3, M0, C++ and Rust correctness (no timing threshold)
        run: python benchmarks/mutable/run.py --candidate "$GITHUB_SHA" --check-only --output build/mutable-study
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutable-study
          path: |
            build/mutable-study/report.json
            build/mutable-study/A3/*.ll
            build/mutable-study/M0/*.ll
            build/mutable-study/M0/*.s
            build/mutable-study/M0/*.su
