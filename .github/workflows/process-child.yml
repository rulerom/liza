name: Scoped native child process
on:
  pull_request:
    paths: ['liza/**', 'tests/test_process.py', 'tests/test_httpws.py', 'tests/native/process_*.c', 'examples/apps/process_child.liza', '.github/workflows/process-child.yml']
  push:
    branches: [main]
    paths: ['liza/**', 'tests/test_process.py', 'tests/test_httpws.py', 'tests/native/process_*.c', 'examples/apps/process_child.liza', '.github/workflows/process-child.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  process:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: clang --version
      - run: python -m unittest discover -s tests -p test_process.py -v
