name: Relay mathematical model (experimental)
on:
  pull_request:
    paths:
      - 'verification/relay_model/**'
      - 'verification/requirements.txt'
      - '.github/workflows/relay-model.yml'
  push:
    branches: [main]
    paths:
      - 'verification/relay_model/**'
      - 'verification/requirements.txt'
      - '.github/workflows/relay-model.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r verification/requirements.txt
      - run: python -m unittest verification.relay_model.test_model -v
      - run: python -m verification.relay_model.check --output build/relay-model/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-model-${{ matrix.os }}
          path: build/relay-model/
