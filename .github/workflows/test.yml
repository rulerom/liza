name: Compiler tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: clang --version
      - name: Configure expected trap tests on Linux
        if: runner.os == 'Linux'
        run: |
          # A piped crash reporter ignores RLIMIT_CORE and can delay each trap.
          # This runner is disposable; use file-based dumps so ulimit applies.
          sysctl kernel.core_pattern kernel.core_pipe_limit
          sudo sysctl -w kernel.core_pattern=core
      - name: Run compiler tests
        run: |
          ulimit -c 0
          python -m unittest discover -s tests -v
      - name: Inspect RTP view read cost
        run: python tools/check_view_cost.py --output build/view-cost
      - uses: actions/upload-artifact@v4
        with:
          name: view-cost-${{ matrix.os }}
          path: build/view-cost/
      - name: Inspect RTP Result and match cost
        run: python tools/check_result_cost.py --output build/result-cost
      - uses: actions/upload-artifact@v4
        with:
          name: result-cost-${{ matrix.os }}
          path: build/result-cost/
      - name: Inspect console runtime cost
        run: python tools/check_console_cost.py --output build/console-cost
      - uses: actions/upload-artifact@v4
        with:
          name: console-cost-${{ matrix.os }}
          path: build/console-cost/
      - name: Inspect bounded file input cost
        run: python tools/check_file_cost.py --output build/file-cost
      - uses: actions/upload-artifact@v4
        with:
          name: file-cost-${{ matrix.os }}
          path: build/file-cost/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Windows compiler and console acceptance
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          clang --version
          python -m unittest discover -s tests -p test_windows.py -v
          if errorlevel 1 exit /b 1
          python tools/check_console_cost.py --output build/console-cost
          if errorlevel 1 exit /b 1
          python tools/check_file_cost.py --output build/file-cost
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: console-cost-windows
          path: build/console-cost/
      - uses: actions/upload-artifact@v4
        with:
          name: file-cost-windows
          path: build/file-cost/
