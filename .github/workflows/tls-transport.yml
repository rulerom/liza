name: TLS transport and clients
on:
  pull_request:
    paths: ['liza/**', 'examples/rtsp/**', 'examples/rtpservice/**', 'examples/apps/liza_rtsp_service.liza', 'tests/test_rtp_service.py', 'tests/test_reactor_connected_udp.py', 'tests/native/reactor_connected_udp.c', 'tests/fixtures/rtp_service_examples.json', 'examples/vg/**', 'examples/apps/liza_rtsp.liza', 'examples/apps/rtp/packet.liza', 'tests/test_rtsp*.py', 'tests/test_tls*.py', 'tests/test_can*.py', 'tests/test_recorder_agent.py', 'tests/native/recorder_fixture.c', 'examples/recorder/**', 'examples/apps/liza_recorder.liza', 'examples/can/**', 'examples/apps/liza_can.liza', 'tests/test_httpws.py', 'examples/httpws/**', 'examples/apps/liza_https.liza', 'examples/apps/liza_wss.liza', 'examples/apps/proxy/config.liza', 'tests/native/tls_transport.c', 'tests/fixtures/tls_backpressure.h', '.github/workflows/tls-transport.yml']
  push:
    branches: [main]
    paths: ['liza/**', 'examples/rtsp/**', 'examples/rtpservice/**', 'examples/apps/liza_rtsp_service.liza', 'tests/test_rtp_service.py', 'tests/test_reactor_connected_udp.py', 'tests/native/reactor_connected_udp.c', 'tests/fixtures/rtp_service_examples.json', 'examples/vg/**', 'examples/apps/liza_rtsp.liza', 'examples/apps/rtp/packet.liza', 'tests/test_rtsp*.py', 'tests/test_tls*.py', 'tests/test_can*.py', 'tests/test_recorder_agent.py', 'tests/native/recorder_fixture.c', 'examples/recorder/**', 'examples/apps/liza_recorder.liza', 'examples/can/**', 'examples/apps/liza_can.liza', 'tests/test_httpws.py', 'examples/httpws/**', 'examples/apps/liza_https.liza', 'examples/apps/liza_wss.liza', 'examples/apps/proxy/config.liza', 'tests/native/tls_transport.c', 'tests/fixtures/tls_backpressure.h', '.github/workflows/tls-transport.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      LIZA_TEST_TLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenSSL development files (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Locate OpenSSL 3 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "LIZA_OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Install OpenSSL 3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tlsPrefix = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows'
          "LIZA_OPENSSL_PREFIX=$tlsPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$tlsPrefix/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: clang --version
      - run: python -m unittest discover -s tests -p "test_tls*.py" -v
      - run: python -m unittest discover -s tests -p "test_can*.py" -v
      - run: python -m unittest discover -s tests -p "test_recorder_agent.py" -v
      - run: python -m unittest discover -s tests -p "test_rtsp*.py" -v
      - run: python -m unittest discover -s tests -p "test_rtp_service.py" -v
      - run: python -m unittest discover -s tests -p "test_reactor_connected_udp.py" -v
