name: Liza Verified (experimental)
on: [push, pull_request]
jobs:
  arithmetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r verification/requirements.txt
      - run: clang --version
      - name: Test the verifier and fail-closed behavior
        run: python -m unittest verification.test_verifier -v
      - name: Verify actual Semantic IR and LLVM O0/O2
        run: python verification/check.py --output build/verified
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-${{ matrix.os }}
          path: build/verified/
  bounds:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r verification/requirements.txt
      - run: clang --version
      - name: Test V1 memory, control flow and frozen V0
        run: python -m unittest verification.v1.test_verifier -v
      - name: Verify bounds and snapshot independence
        run: python verification/v1/check.py --output build/verified-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-v1-${{ matrix.os }}
          path: build/verified-v1/
