name: Verification pipeline
on:
  pull_request:
    paths:
      - 'liza/**'
      - 'verification/**'
      - '.github/workflows/verified-pipeline.yml'
  push:
    branches: [main]
    paths:
      - 'liza/**'
      - 'verification/**'
      - '.github/workflows/verified-pipeline.yml'
  workflow_dispatch:
    inputs:
      full:
        description: Run full V0–V4 with the pinned macOS proof toolchain
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test fail-closed adapters, snapshotting and actual V4 partial run
        run: python -m unittest verification.pipeline.test_pipeline -v
  full:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    needs: harness
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r verification/requirements.txt
      - name: Install proof toolchain candidates
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew update
          brew install llvm@23 z3 re2c cmake ninja
          brew upgrade llvm@23 z3
      - name: Restore locked Z3 bottle
        env:
          # Local formula loading is opt-in; the archive SHA-256 is checked first.
          HOMEBREW_DEVELOPER: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          bottle="$(python -m verification.v3.fetch_bottle --package z3 --directory "$RUNNER_TEMP/proof-bottles")"
          brew reinstall "$bottle"
      - name: Verify pinned toolchain
        run: |
          python verification/v3/toolchain.py \
            --llvm-prefix "$(brew --prefix llvm@23)" \
            --z3-prefix "$(brew --prefix z3)" \
            --zstd-prefix "$(brew --prefix zstd)"
      - name: Build unmodified pinned Alive2
        run: |
          git clone https://github.com/AliveToolkit/alive2 "$RUNNER_TEMP/alive2"
          git -C "$RUNNER_TEMP/alive2" checkout --detach a68009c9e81575bdcc249d3cc534514a76112221
          ALIVE_SOURCE="$RUNNER_TEMP/alive2" LLVM_PREFIX="$(brew --prefix llvm@23)" Z3_PREFIX="$(brew --prefix z3)" sh verification/v3/build.sh
      - name: Run all five experiments from one source snapshot
        run: |
          llvm_prefix="$(brew --prefix llvm@23)"
          python -m verification.pipeline --output build/verified-pipeline \
            --clang /usr/bin/clang --v3-clang "$llvm_prefix/bin/clang" \
            --alive-tv "$RUNNER_TEMP/alive2/build/alive-tv" --alive-source "$RUNNER_TEMP/alive2" \
            --llvm-config "$llvm_prefix/bin/llvm-config" --opt "$llvm_prefix/bin/opt" \
            --llvm-revision "Homebrew-$($llvm_prefix/bin/llvm-config --version)" \
            --z3 "$(brew --prefix z3)/bin/z3" \
            --toolchain-lock verification/v3/toolchain-lock.json
      - name: Check saved bundle integrity
        run: python -m verification.pipeline --check-bundle build/verified-pipeline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-pipeline-full
          path: build/verified-pipeline/
