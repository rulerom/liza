name: SG3 Liza scoped reactor group
on:
  pull_request:
    paths: ['tests/test_sg3.py', 'tests/test_sg4_udp.py', 'tests/fixtures/sg4_udp.c', 'examples/workers/udp_group.liza', 'tests/fixtures/sg3_faults.c', 'examples/workers/reactor_group.liza', 'liza/**', '.github/workflows/sg3-api.yml']
  push:
    branches: [main]
    paths: ['tests/test_sg3.py', 'tests/test_sg4_udp.py', 'tests/fixtures/sg4_udp.c', 'examples/workers/udp_group.liza', 'tests/fixtures/sg3_faults.c', 'examples/workers/reactor_group.liza', 'liza/**', '.github/workflows/sg3-api.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_sg3.py -v
      - run: python -m unittest discover -s tests -p test_sg4_udp.py -v
