name: Verified Relay R2-A (buffer model)
on: [push, pull_request]
jobs:
  buffer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r verification/requirements.txt
      - run: python -m unittest verification.relay_r2a.test_model -v
      - run: python -m verification.relay_r2a.check --output build/verified-relay-r2a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-relay-r2a-${{ matrix.os }}
          path: build/verified-relay-r2a/
