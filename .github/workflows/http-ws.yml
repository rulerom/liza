name: HTTP and WebSocket client
on:
  pull_request:
    paths: ['liza/**', 'examples/httpws/**', 'examples/liza_http.liza', 'examples/liza_ws.liza', 'examples/apps/proxy/config.liza', 'tests/test_httpws.py', '.github/workflows/http-ws.yml']
  push:
    branches: [main]
    paths: ['liza/**', 'examples/httpws/**', 'examples/liza_http.liza', 'examples/liza_ws.liza', 'examples/apps/proxy/config.liza', 'tests/test_httpws.py', '.github/workflows/http-ws.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  client:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: clang --version
      - run: python -m unittest discover -s tests -p test_httpws.py -v
