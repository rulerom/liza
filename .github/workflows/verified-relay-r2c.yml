name: Verified Relay R2-C (pair lifecycle)
on: [push, pull_request]
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r verification/requirements.txt
      - run: python -m unittest verification.relay_r2c.test_model -v
      - run: python -m verification.relay_r2c.check --output build/verified-relay-r2c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-relay-r2c-${{ matrix.os }}
          path: build/verified-relay-r2c/
