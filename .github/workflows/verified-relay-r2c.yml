name: Verified Relay R2-C (pair lifecycle)
on:
  pull_request:
    paths:
      - 'liza/**'
      - 'verification/relay_r1/**'
      - 'verification/relay_r2b/**'
      - 'verification/relay_r2c/**'
      - 'verification/requirements.txt'
      - 'examples/apps/liza_proxy.liza'
      - 'examples/apps/relay/direction.liza'
      - '.github/workflows/verified-relay-r2c.yml'
  push:
    branches: [main]
    paths:
      - 'liza/**'
      - 'verification/relay_r1/**'
      - 'verification/relay_r2b/**'
      - 'verification/relay_r2c/**'
      - 'verification/requirements.txt'
      - 'examples/apps/liza_proxy.liza'
      - 'examples/apps/relay/direction.liza'
      - '.github/workflows/verified-relay-r2c.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r verification/requirements.txt
      - run: python -m unittest verification.relay_r2c.test_model -v
      - run: python -m verification.relay_r2c.check --output build/verified-relay-r2c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-relay-r2c-${{ matrix.os }}
          path: build/verified-relay-r2c/
