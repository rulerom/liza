name: Runtime reactor wait sources
on:
  pull_request:
    paths: ['tests/test_reactor_sources.py', 'tests/native/reactor_sources.c', 'experiments/reactor_wakeup/probe.c', 'experiments/notification_protocol/protocol.h', 'liza/runtime/**', '.github/workflows/reactor-sources.yml']
  push:
    branches: [main]
    paths: ['tests/test_reactor_sources.py', 'tests/native/reactor_sources.c', 'experiments/reactor_wakeup/probe.c', 'experiments/notification_protocol/protocol.h', 'liza/runtime/**', '.github/workflows/reactor-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_reactor_sources.py -v
